<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="resister.css"
    >

</head>


<body>

    <div class="register-container">

        <div class="register-card">

            <h2>Create Account</h2>

            <p>Register to use Expense Management</p>


           <form id="registerForm">

    <div class="form-group">

        <label>User ID</label>

        <input
            type="text"
            id="registerUserId"
            placeholder="Enter User ID"
            autocomplete="off"
            required
        >

    </div>


    <div class="form-group">

        <label>Password</label>

        <input
            type="password"
            id="registerPassword"
            placeholder="Enter Password"
            autocomplete="new-password"
            required
        >

    </div>


    <button
        type="submit"
        id="registerBtn"
    >
        Register
    </button>


    <p class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</form>

        </div>

    </div>


    <script src="resister.js"></script>

</body>

</html>
